[project]
name = 'backend'
version = '0.1.0'
description = 'GCP template project for scaffolding applications with a Python backend and a TypeScript frontend.'
readme = 'README.md'
requires-python = '>=3.13'
dependencies = [
  'fastapi>=0.162.0',
  "google-cloud-firestore>=2.34.1",
  'httpx',
  'pydantic',
  'python-dotenv',
  'uvicorn>=0.54.0',
]

[project.scripts]
backend = 'backend.main:main'
export-openapi = 'backend.services:export_openapi'

[dependency-groups]
dev = [
  'mypy',
  'pytest',
  'pytest-asyncio>=1.4.1.post1',
  'pytest-cov',
  'pytest-mock',
  'ruff',
]

[tool.ruff]
line-length = 80
indent-width = 4
src = ['.', 'src']
exclude = [
  '.bzr',
  '.direnv',
  '.eggs',
  '.git',
  '.git-rewrite',
  '.hg',
  '.ipynb_checkpoints',
  '.mypy_cache',
  '.nox',
  '.pants.d',
  '.pyenv',
  '.pytest_cache',
  '.pytype',
  '.ruff_cache',
  '.svn',
  '.tox',
  '.venv',
  '.vscode',
  '__pypackages__',
  '_build',
  'buck-out',
  'build',
  'dist',
  'node_modules',
  'site-packages',
  'venv',
]

[tool.ruff.lint]
select = ['E', 'F', 'I', 'N', 'UP', 'B', 'Q']
ignore = []
fixable = ['ALL']
unfixable = []
dummy-variable-rgx = '^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$'

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'single'
docstring-quotes = 'single'
avoid-escape = true

[tool.ruff.format]
# The formatter forces ''' on docstrings under 'single'; the Q rules enforce quotes.
quote-style = 'preserve'
indent-style = 'space'
skip-magic-trailing-comma = false
line-ending = 'auto'
docstring-code-format = false
docstring-code-line-length = 'dynamic'

[tool.mypy]
files = ['src', 'test']
strict = true
warn_unreachable = true
pretty = true
# google-api-core leaves exception constructors unannotated upstream.
untyped_calls_exclude = ['google.api_core.exceptions']

[tool.coverage.run]
source = ['src']
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
  'if __name__ == .__main__.:',
  'if TYPE_CHECKING:',
]

[build-system]
requires = ['uv_build>=0.13.6,<0.14']
build-backend = 'uv_build'
